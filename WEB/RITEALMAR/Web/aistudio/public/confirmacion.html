<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Solicitud Recibida! | Ritealmar</title>
    <style>
        body {
            background: #030510;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 60px;
            border-radius: 40px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            max-width: 500px;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #C5A059;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 0 40px rgba(197, 160, 89, 0.4);
        }
        h1 { font-size: 32px; font-weight: 900; margin-bottom: 20px; }
        p { color: rgba(248,250,252,0.7); line-height: 1.6; margin-bottom: 40px; }
        .btn {
            background: #C5A059;
            color: #000;
            padding: 15px 30px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 900;
            font-size: 14px;
            display: inline-block;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2F0JV1XCZL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-2F0JV1XCZL');
      
      // Evento de conversión para Google Ads / Analytics
      gtag('event', 'generate_lead', {
        'service': 'auditoria_tecnologica',
        'value': 1.0,
        'currency': 'EUR'
      });
    </script>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24" width="40" height="40" stroke="black" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h1>¡Solicitud Enviada!</h1>
        <p>Nuestro equipo de ingeniería revisará tu caso y te contactará en menos de 24 horas.</p>
        <a href="/" class="btn">Volver a la web</a>
    </div>
</body>
</html>
